<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>直流回路とコンデンサー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2828;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --dark: #1e293b;
            --bg-panel: #f8fafc;
            --bg-canvas: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background: var(--bg-panel); 
            overflow: hidden; 
            color: var(--text-main);
        }
        
        #container { display: flex; width: 100%; height: 100vh; flex-direction: row; }
        
        #canvas-container { 
            flex-grow: 1; 
            background: var(--bg-canvas); 
            position: relative; 
            overflow: hidden; 
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        
        canvas { display: block; touch-action: none; cursor: crosshair; width: 100%; height: 100%; }
        
        #controls { 
            width: 320px; 
            background: #ffffff; 
            border-left: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
            box-shadow: -4px 0 15px rgba(0,0,0,0.03);
            flex-shrink: 0;
        }

        .panel-header {
            padding: 20px 20px 15px;
            border-bottom: 1px solid var(--border);
            background: #ffffff;
        }

        .panel-content {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .group { 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
        }
        
        h4 { margin: 0 0 12px 0; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn { 
            width: 100%; 
            min-height: 42px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 8px; 
            font-size: 14px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .btn:active { transform: scale(0.98); }
        
        .btn-mode { height: 50px; font-size: 16px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-edit { background: var(--dark); }
        .btn-edit:hover { background: #0f172a; }
        .btn-sim { background: var(--success); }
        .btn-sim:hover { background: var(--success-hover); }
        
        .btn-tool { background: #ffffff; color: var(--text-main); border: 2px solid var(--border); }
        .btn-tool:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-tool.active { 
            background: #eff6ff; 
            border-color: var(--primary); 
            color: var(--primary); 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .btn-action { background: #94a3b8; }
        .btn-action:hover { background: #64748b; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }

        .hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 5px; }
        .icon { font-size: 18px; }

        @media (max-width: 768px) {
            #container { flex-direction: column-reverse; }
            #controls { width: 100%; height: 45vh; border-left: none; border-top: 1px solid var(--border); }
            #canvas-container { height: 55vh; }
        }
    </style>
    <meta property="og:image" content="https://kaneshigenobutsuri.github.io/electrostatic-capacitor/ogp-image.png">
<meta property="og:description" content="自由に電気回路を組みながら、コンデンサーに電荷が溜まる様子を可視化しています">
</head>
<body>
<div id="container">
    <div id="canvas-container" oncontextmenu="return false;">
        <canvas id="simCanvas"></canvas>
        <div id="zoom-controls" style="position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10;">
            <button onclick="zoomBtn(1.2)" title="拡大" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 18px; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">+</button>
            <button onclick="resetZoom()" title="リセット" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 12px; font-weight: bold; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">1x</button>
            <button onclick="zoomBtn(1/1.2)" title="縮小" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 18px; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">-</button>
        </div>
    </div>
    <div id="controls">
        <div class="panel-header">
            <button id="mode-toggle" class="btn btn-mode btn-sim" onclick="toggleMode()">
                <span class="icon">▶</span> 実験を開始する
            </button>
        </div>
        
        <div class="panel-content">
            <div id="edit-panel">
                <div class="group">
                    <h4>配置ツール</h4>
                    <button id="btn-pan" class="btn btn-tool" onclick="setMode('pan')">
                        <span class="icon">✋</span> 画面の移動
                    </button>
                    <button id="btn-wire" class="btn btn-tool active" onclick="setMode('wire')">
                        <span class="icon">✏️</span> 導線を引く
                    </button>
                    <button id="btn-battery" class="btn btn-tool" onclick="setMode('battery')">
                        <span class="icon">🔋</span> 電源
                    </button>
                    <button id="btn-capacitor" class="btn btn-tool" onclick="setMode('capacitor')">
                        <span class="icon">⏸️</span> コンデンサー
                    </button>
                    <button id="btn-switch" class="btn btn-tool" onclick="setMode('switch')">
                        <span class="icon">🕹️</span> スイッチ
                    </button>
                    <div class="hint">
                        【導線】ドラッグで描画、ダブルタップで消去<br>
                        【素子】タップで配置、ドラッグで移動<br>
                        ※画面の移動は<b>2本指スワイプ</b>、または「画面の移動」ツールを使用
                    </div>
                </div>

                <div class="group" id="selection-group" style="display:none; border-color: var(--primary);">
                    <h4 style="color: var(--primary);">選択中</h4>
                    <div id="prop-editor" style="margin-bottom: 12px;"></div>
                    <button class="btn btn-danger" onclick="deleteSelected()">
                        <span class="icon">✂️</span> この素子を消去
                    </button>
                    <div class="hint">ドラッグして移動できます</div>
                </div>

                <div class="group">
                    <h4>操作</h4>
                    <button class="btn btn-action" onclick="undo()">
                        <span class="icon">↩️</span> ひとつ戻す
                    </button>
                    <button class="btn btn-danger" onclick="resetToDefault()">
                        <span class="icon">🔄</span> 初期状態に戻す
                    </button>
                </div>
            </div>

            <div id="sim-panel" style="display:none;">
                <div class="group">
                    <h4>実験コントロール</h4>
                    <button class="btn" style="background:var(--warning);" onclick="dischargeAll()">
                        <span class="icon">⚡</span> 全コンデンサーを放電
                    </button>
                    <div class="hint">
                        スイッチをクリックして回路を閉じます。<br>
                        コンデンサーに電位差が生じると、一瞬で電荷が蓄積・移動します。<br>
                        ※画面の移動は<b>2本指スワイプ</b>で行えます。
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let isSimMode = false, mode = 'wire', elements = [], wires = [], selectedObj = null;
    let offsetX = 0, offsetY = 0, scale = 1.0, history = [];
    
    let isCreatingWire = false, wireStart = null, wireCurrent = null;
    let isDragging = false, dragOffset = {x:0, y:0};
    let isPanning = false, lastPanPos = {x:0, y:0};
    const SNAP = 40;

    let isPossibleTap = false;
    let tapStartPos = {x:0, y:0};
    let lastTapTime = 0;
    let lastTapWire = null;

    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        
        canvas.addEventListener('touchstart', (e) => { 
            if(e.target === canvas) e.preventDefault(); 
            if (e.touches.length === 2) {
                isPanning = true;
                lastPanPos = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1) {
                onDown(e); 
            }
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => { 
            if(e.target === canvas) e.preventDefault();
            if (e.touches.length === 2 && isPanning) {
                const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                offsetX += (cx - lastPanPos.x);
                offsetY += (cy - lastPanPos.y);
                lastPanPos = {x: cx, y: cy};
                updateBackgroundPosition();
            } else if (e.touches.length === 1) {
                onMove(e); 
            }
        }, {passive: false});
        
        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                isPanning = false;
            }
            if (e.touches.length === 0) onUp(e);
        });
        
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedObj && !isSimMode) deleteSelected();
        });
        
        updateBackgroundPosition();
        loadDefault();
        animate();
    }

    function updateBackgroundPosition() {
        const container = document.getElementById('canvas-container');
        container.style.backgroundPosition = `${offsetX}px ${offsetY}px`;
        container.style.backgroundSize = `${40 * scale}px ${40 * scale}px`;
    }

    function autoClean() {
        wires = wires.filter(w => w.x1 !== w.x2 || w.y1 !== w.y2);
        const uniqueWires = [];
        wires.forEach(w => {
            const isDup = uniqueWires.some(uw => 
                (uw.x1 === w.x1 && uw.y1 === w.y1 && uw.x2 === w.x2 && uw.y2 === w.y2) ||
                (uw.x1 === w.x2 && uw.y1 === w.y2 && uw.x2 === w.x1 && uw.y2 === w.y1)
            );
            if (!isDup) uniqueWires.push(w);
        });
        wires = uniqueWires;
    }

    function calculateWirePath(p1, p2) {
        if (!p1 || !p2) return [];
        if (p1.x === p2.x && p1.y === p2.y) return [];
        return [{x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y}];
    }

    function getFoot(el, isPlus) {
        const sign = isPlus ? 1 : -1;
        return {
            x: el.rx + (el.dir === 'h' ? 20 * sign : 0),
            y: el.ry + (el.dir === 'v' ? 20 * sign : 0)
        };
    }

    function solveLinearSystem(A, b) {
        const n = A.length;
        if (n === 0) return [];
        const a = A.map(row => [...row]);
        const x = [...b];
        
        for (let i = 0; i < n; i++) {
            let maxRow = i;
            for (let k = i + 1; k < n; k++) {
                if (Math.abs(a[k][i]) > Math.abs(a[maxRow][i])) maxRow = k;
            }
            [a[i], a[maxRow]] = [a[maxRow], a[i]];
            [x[i], x[maxRow]] = [x[maxRow], x[i]];
            
            if (Math.abs(a[i][i]) < 1e-9) continue; 
            
            for (let k = i + 1; k < n; k++) {
                const factor = a[k][i] / a[i][i];
                for (let j = i; j < n; j++) a[k][j] -= factor * a[i][j];
                x[k] -= factor * x[i];
            }
        }
        
        const res = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) {
            if (Math.abs(a[i][i]) < 1e-9) { res[i] = 0; continue; }
            let sum = 0;
            for (let j = i + 1; j < n; j++) sum += a[i][j] * res[j];
            res[i] = (x[i] - sum) / a[i][i];
        }
        return res;
    }

    function buildClusters() {
        const adj = new Map();
        function addEdge(x1, y1, x2, y2) {
            if (x1 === x2 && y1 === y2) return;
            const k1 = `${x1},${y1}`, k2 = `${x2},${y2}`;
            if (!adj.has(k1)) adj.set(k1, []);
            if (!adj.has(k2)) adj.set(k2, []);
            if (!adj.get(k1).includes(k2)) adj.get(k1).push(k2);
            if (!adj.get(k2).includes(k1)) adj.get(k2).push(k1);
        }

        const allPoints = new Set();
        wires.forEach(w => {
            allPoints.add(`${w.x1},${w.y1}`); allPoints.add(`${w.x2},${w.y2}`);
        });
        elements.forEach(el => {
            allPoints.add(`${el.rx},${el.ry}`);
            const f1 = getFoot(el, true), f2 = getFoot(el, false);
            allPoints.add(`${f1.x},${f1.y}`); allPoints.add(`${f2.x},${f2.y}`);
        });

        wires.forEach(w => {
            const pointsOnWire = [];
            for (let p of allPoints) {
                const [px, py] = p.split(',').map(Number);
                if (distToSeg({rx: px, ry: py}, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2}) < 1) {
                    pointsOnWire.push({x: px, y: py});
                }
            }
            pointsOnWire.sort((a, b) => Math.hypot(a.x - w.x1, a.y - w.y1) - Math.hypot(b.x - w.x1, b.y - w.y1));
            for (let i = 0; i < pointsOnWire.length - 1; i++) {
                addEdge(pointsOnWire[i].x, pointsOnWire[i].y, pointsOnWire[i+1].x, pointsOnWire[i+1].y);
            }
        });

        elements.forEach(el => {
            if (el.type === 'switch' && !el.isOpen) {
                const f1 = getFoot(el, true), f2 = getFoot(el, false);
                addEdge(f1.x, f1.y, f2.x, f2.y);
            }
        });

        elements.forEach(el => {
            if (el.type === 'capacitor' || el.type === 'battery' || (el.type === 'switch' && el.isOpen)) {
                const ck = `${el.rx},${el.ry}`;
                adj.delete(ck);
                for (let [k, neighbors] of adj.entries()) {
                    adj.set(k, neighbors.filter(n => n !== ck));
                }
            }
        });

        const visited = new Set();
        const clusters = [];
        const nodeToCluster = new Map();

        for (let key of adj.keys()) {
            if (!visited.has(key)) {
                const clusterId = clusters.length;
                const clusterNodes = [];
                const queue = [key];
                visited.add(key);

                while(queue.length > 0) {
                    const curr = queue.shift();
                    clusterNodes.push(curr);
                    nodeToCluster.set(curr, clusterId);
                    
                    for (let n of adj.get(curr)) {
                        if (!visited.has(n)) { visited.add(n); queue.push(n); }
                    }
                }
                clusters.push({ id: clusterId, nodes: clusterNodes, adj: adj });
            }
        }
        return { clusters, nodeToCluster, adj };
    }

    function updatePhysics() {
        const { clusters, nodeToCluster, adj } = buildClusters();
        
        const clusterCount = clusters.length;
        const compEdges = [];
        
        elements.forEach(el => {
            if (el.type === 'battery' || el.type === 'capacitor') {
                const fu = getFoot(el, true), fv = getFoot(el, false);
                const u = nodeToCluster.get(`${fu.x},${fu.y}`);
                const v = nodeToCluster.get(`${fv.x},${fv.y}`);
                if (u !== undefined && v !== undefined) {
                    compEdges.push({ el, u, v });
                }
            }
        });

        const clusterGroups = [];
        const visitedCluster = new Set();
        for (let i = 0; i < clusterCount; i++) {
            if (!visitedCluster.has(i)) {
                const group = [];
                const queue = [i];
                visitedCluster.add(i);
                while (queue.length > 0) {
                    const curr = queue.shift();
                    group.push(curr);
                    compEdges.forEach(edge => {
                        if (edge.u === curr && !visitedCluster.has(edge.v)) {
                            visitedCluster.add(edge.v); queue.push(edge.v);
                        }
                        if (edge.v === curr && !visitedCluster.has(edge.u)) {
                            visitedCluster.add(edge.u); queue.push(edge.u);
                        }
                    });
                }
                clusterGroups.push(group);
            }
        }

        const V_cluster = new Array(clusterCount).fill(0);
        const R_sim = 1.0;

        const MAX_ITER = 200; 
        for (let iter = 0; iter < MAX_ITER; iter++) {
            let maxDq = 0;

            clusterGroups.forEach(group => {
                const M = group.length;
                if (M <= 1) return;
                
                const clusterToLocal = new Map();
                group.forEach((c, idx) => clusterToLocal.set(c, idx));
                
                const A = Array.from({length: M-1}, () => new Array(M-1).fill(0));
                const b = new Array(M-1).fill(0);
                
                compEdges.forEach(edge => {
                    const lu = clusterToLocal.get(edge.u);
                    const lv = clusterToLocal.get(edge.v);
                    if (lu !== undefined && lv !== undefined) {
                        let Ve = 0;
                        if (edge.el.type === 'battery') Ve = edge.el.reverse ? -edge.el.val : edge.el.val;
                        if (edge.el.type === 'capacitor') {
                            if (edge.el.q === undefined) edge.el.q = (edge.el.polarity || 1) * (edge.el.charge || 0);
                            Ve = edge.el.q / edge.el.val;
                        }

                        if (lu > 0) { A[lu-1][lu-1] += 1/R_sim; b[lu-1] += Ve/R_sim; }
                        if (lv > 0) { A[lv-1][lv-1] += 1/R_sim; b[lv-1] -= Ve/R_sim; }
                        if (lu > 0 && lv > 0) {
                            A[lu-1][lv-1] -= 1/R_sim; A[lv-1][lu-1] -= 1/R_sim;
                        }
                    }
                });
                
                const x = solveLinearSystem(A, b);
                for (let i = 1; i < M; i++) V_cluster[group[i]] = x[i-1];
            });

            compEdges.forEach(edge => {
                if (edge.el.type === 'capacitor') {
                    const Vu = V_cluster[edge.u];
                    const Vv = V_cluster[edge.v];
                    const C = edge.el.val;
                    
                    const Q_target = C * (Vu - Vv);
                    
                    const dq = (Q_target - edge.el.q) * 0.5;
                    
                    edge.el.q += dq;
                    if (Math.abs(dq) > maxDq) maxDq = Math.abs(dq);
                }
            });

            if (maxDq < 0.001) break; 
        }

        compEdges.forEach(edge => {
            if (edge.el.type === 'capacitor') {
                if (Math.abs(edge.el.q) < 0.01) edge.el.q = 0;

                edge.el.charge = Math.abs(edge.el.q);
                edge.el.polarity = edge.el.q >= 0 ? 1 : -1;
                if (Math.abs(edge.el.q) > 0.1) {
                    edge.el.basePolarity = edge.el.q >= 0 ? 1 : -1;
                }
            }
        });
    }

    function formatCharge(uC) {
        if (uC === 0) return "0μC";
        const abs = Math.abs(uC);
        if (abs >= 1000000) return (uC / 1000000).toFixed(2).replace(/\.00$/, '') + 'C';
        if (abs >= 1000) return (uC / 1000).toFixed(1).replace(/\.0$/, '') + 'mC';
        return Math.round(uC) + 'μC';
    }

    function drawElement(el) {
        ctx.save();
        ctx.translate(el.rx, el.ry);
        if (el.dir === 'v') ctx.rotate(Math.PI/2);
        
        ctx.fillStyle = "#ffffff"; 
        ctx.fillRect(-22, -22, 44, 44);
        
        ctx.strokeStyle = "#64748b"; 
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (el.type === 'battery' || el.type === 'capacitor') {
            ctx.moveTo(-22, 0); ctx.lineTo(-6, 0); ctx.moveTo(6, 0); ctx.lineTo(22, 0);
        } else if (el.type === 'switch') {
            ctx.moveTo(-22, 0); ctx.lineTo(-12, 0); ctx.moveTo(12, 0); ctx.lineTo(22, 0);
        }
        ctx.stroke();

        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
        
        if (selectedObj === el && !isSimMode) {
            ctx.shadowBlur = 10; ctx.shadowColor = "#3b82f6"; ctx.strokeStyle = "#3b82f6";
        } else {
            ctx.shadowBlur = 0; ctx.strokeStyle = "#1e293b"; 
        }

        if (el.type === 'battery') {
            const sign = el.reverse ? -1 : 1;

            ctx.beginPath(); ctx.moveTo(-6 * sign, -10); ctx.lineTo(-6 * sign, 10); 
            ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 5; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6 * sign, -18); ctx.lineTo(6 * sign, 18); 
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; ctx.stroke();
            
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineWidth = 2.5;
            
            ctx.strokeStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(13 * sign, -13); ctx.lineTo(13 * sign, -5); 
            ctx.moveTo(9 * sign, -9); ctx.lineTo(17 * sign, -9); 
            ctx.stroke();

            ctx.strokeStyle = "#3b82f6";
            ctx.beginPath();
            ctx.moveTo(-13 * sign, -13); ctx.lineTo(-13 * sign, -5); 
            ctx.stroke();
            
            ctx.restore();

        } else if (el.type === 'capacitor') {
            ctx.strokeStyle = (selectedObj === el && !isSimMode) ? "#3b82f6" : "#1e293b"; 
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(-6, 16); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, -16); ctx.lineTo(6, 16); ctx.stroke();
            
            let currentQ = el.q !== undefined ? el.q : ((el.polarity||1) * (el.charge||0));
            
            const pol = el.basePolarity !== undefined ? el.basePolarity : (currentQ >= 0 ? 1 : -1);
            const absQ = Math.abs(currentQ);
            
            const chargePerDot = 1000;
            let n = Math.floor(absQ / chargePerDot);
            
            if (absQ >= 10 && n === 0) n = 1;
            
            const maxDots = 10;
            n = Math.min(n, maxDots);
            
            if (n > 0) {
                const dotSpacing = 30 / n; 
                for(let i = 0; i < n; i++) {
                    const yPos = -15 + (i + 0.5) * dotSpacing;
                    drawGlowDot(-13 * pol, yPos, "#3b82f6", 2.0);
                    drawGlowDot(13 * pol, yPos, "#ef4444", 2.0); 
                }
            }

        } else if (el.type === 'switch') {
            ctx.strokeStyle = (selectedObj === el && !isSimMode) ? "#3b82f6" : "#1e293b"; 
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-12, 0, 4, 0, 7); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(12, 0, 4, 0, 7); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.stroke();
            
            ctx.beginPath(); 
            if(el.isOpen) { 
                ctx.moveTo(-12, 0); ctx.lineTo(6, -16); ctx.strokeStyle = "#f59e0b"; 
            } else { 
                ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.strokeStyle = "#10b981"; 
            } 
            ctx.stroke();
        }
        
        ctx.restore();

        ctx.save();
        ctx.translate(el.rx, el.ry);
        let text = "", subText = "";
        if (el.type === 'battery') text = `${el.val}V`;
        if (el.type === 'capacitor') {
            text = `${el.val}μF`;
            let currentQ = el.q !== undefined ? el.q : ((el.polarity||1) * (el.charge||0));
            const voltage = el.val > 0 ? (currentQ / el.val).toFixed(1) : "0.0";
            if (isSimMode || Math.abs(currentQ) > 0.01) {
                subText = `Q=${formatCharge(Math.abs(currentQ))}, V=${Math.abs(voltage)}V`;
            }
        }
        
        if (text) {
            ctx.font = "600 13px 'Segoe UI', sans-serif";
            const textWidth = ctx.measureText(text).width;
            let tx = 22, ty = -18;
            if (el.dir === 'h') { tx = -20; ty = 30; }
            
            if (subText) {
                ctx.font = "600 12px 'Segoe UI', sans-serif";
                const subTextWidth = ctx.measureText(subText).width;
                const boxWidth = Math.max(textWidth, subTextWidth) + 8;
                
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.beginPath(); ctx.roundRect(tx - 4, ty - 12, boxWidth, 34, 4); ctx.fill();
                
                ctx.font = "600 13px 'Segoe UI', sans-serif"; ctx.fillStyle = "#475569"; ctx.fillText(text, tx, ty);
                ctx.font = "600 12px 'Segoe UI', sans-serif"; ctx.fillStyle = "#2563eb"; ctx.fillText(subText, tx, ty + 16);
            } else {
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.beginPath(); ctx.roundRect(tx - 4, ty - 12, textWidth + 8, 18, 4); ctx.fill();
                ctx.fillStyle = "#475569"; ctx.fillText(text, tx, ty);
            }
        }
        ctx.restore();
    }

    function drawGlowDot(x, y, color, r) {
        ctx.save();
        ctx.shadowBlur = 8; ctx.shadowColor = color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = color; ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, r*0.4, 0, 7); ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if (isSimMode) updatePhysics();

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        wires.forEach(w => {
            ctx.beginPath(); ctx.strokeStyle = "#64748b"; ctx.lineWidth = 4;
            ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); 
            ctx.stroke();
        });

        if (isCreatingWire && wireStart && wireCurrent) {
            const tempWires = calculateWirePath(wireStart, wireCurrent);
            ctx.strokeStyle = "rgba(59, 130, 246, 0.6)"; ctx.lineWidth = 4;
            tempWires.forEach(w => {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            });
            ctx.beginPath(); ctx.arc(wireCurrent.x, wireCurrent.y, 5, 0, 7);
            ctx.fillStyle = "#3b82f6"; ctx.fill();
        }

        elements.forEach(drawElement);
        
        ctx.restore();
        requestAnimationFrame(animate);
    }

    function onDown(e) {
        let cx = e.clientX, cy = e.clientY;
        if(e.touches && e.touches.length > 0) {
            cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        }

        if (e.button === 1 || e.button === 2 || mode === 'pan') {
            isPanning = true;
            lastPanPos = {x: cx, y: cy};
            canvas.style.cursor = 'grabbing';
            return;
        }

        const p = getPos(e); 
        const hitEl = elements.find(el => Math.hypot(el.rx - p.rx, el.ry - p.ry) < 25);
        
        if (isSimMode) { 
            if (hitEl && hitEl.type === 'switch') {
                hitEl.isOpen = !hitEl.isOpen; 
            }
            return; 
        }
        
        if (hitEl) {
            selectedObj = hitEl;
            isDragging = true;
            dragOffset = { x: hitEl.rx - p.rx, y: hitEl.ry - p.ry };
            updateSelectionUI();
            return; 
        } else {
            selectedObj = null;
            updateSelectionUI();
        }
        
        if (mode === 'wire') { 
            let hitWireIndex = -1;
            let minDist = 10;
            for (let i = 0; i < wires.length; i++) {
                let w = wires[i];
                let d = distToSeg(p, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2});
                if (d < minDist) {
                    minDist = d;
                    hitWireIndex = i;
                }
            }

            if (hitWireIndex !== -1) {
                const now = Date.now();
                if (now - lastTapTime < 400 && lastTapWire === hitWireIndex) {
                    saveHistory();
                    wires.splice(hitWireIndex, 1);
                    autoClean();
                    lastTapWire = null;
                    isCreatingWire = false;
                    return;
                } else {
                    lastTapTime = now;
                    lastTapWire = hitWireIndex;
                }
            } else {
                lastTapWire = null;
            }

            isCreatingWire = true; 
            wireStart = getGridPos(p);
            wireCurrent = { x: wireStart.x, y: wireStart.y };
        } else {
            isPossibleTap = true;
            tapStartPos = {x: cx, y: cy};
        }
    }
    
    function onMove(e) { 
        let cx = e.clientX, cy = e.clientY;
        if(e.touches && e.touches.length > 0) {
            cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        }

        if (isPossibleTap) {
            if (Math.hypot(cx - tapStartPos.x, cy - tapStartPos.y) > 5) {
                isPossibleTap = false;
            }
        }

        if (isPanning) {
            offsetX += (cx - lastPanPos.x);
            offsetY += (cy - lastPanPos.y);
            lastPanPos = {x: cx, y: cy};
            updateBackgroundPosition();
            return;
        }

        const p = getPos(e); 
        if (isDragging && selectedObj) {
            const newPos = { rx: p.rx + dragOffset.x, ry: p.ry + dragOffset.y };
            const snap = getGridPos(newPos);
            selectedObj.rx = snap.x; selectedObj.ry = snap.y;
            
            let targetDir = selectedObj.dir, minDist = 15;
            for (let w of wires) {
                let d = distToSeg({rx:snap.x, ry:snap.y}, {x:w.x1, y:w.y1}, {x:w.x2, y:w.y2});
                if (d < minDist) {
                    minDist = d;
                    targetDir = (Math.abs(w.x1 - w.x2) > Math.abs(w.y1 - w.y2)) ? 'h' : 'v';
                }
            }
            selectedObj.dir = targetDir;
        }

        if (isCreatingWire && wireStart) {
            wireCurrent = getGridPos(p);
        }
    }
    
    function onUp(e) {
        if (isPossibleTap && mode !== 'pan' && mode !== 'wire') {
            const r = canvas.getBoundingClientRect(); 
            const prx = (tapStartPos.x - r.left - offsetX) / scale;
            const pry = (tapStartPos.y - r.top - offsetY) / scale;
            const snap = getGridPos({rx: prx, ry: pry});
            
            saveHistory();
            let targetDir = 'h', minDist = 15;
            for (let w of wires) {
                let d = distToSeg({rx:snap.x, ry:snap.y}, {x:w.x1, y:w.y1}, {x:w.x2, y:w.y2});
                if (d < minDist) {
                    minDist = d;
                    targetDir = (Math.abs(w.x1 - w.x2) > Math.abs(w.y1 - w.y2)) ? 'h' : 'v';
                }
            }
            let defaultVal = (mode === 'battery') ? 10 : 500;
            const newEl = { type: mode, rx: snap.x, ry: snap.y, dir: targetDir, val: defaultVal, charge: 0, q: 0, id: Date.now(), isOpen: true, reverse: false };
            elements.push(newEl);
            selectedObj = newEl;
            updateSelectionUI();
        }
        isPossibleTap = false;

        if (isPanning) {
            isPanning = false;
            canvas.style.cursor = (mode === 'pan' || isSimMode) ? 'grab' : 'crosshair';
            return;
        }

        if (isDragging) isDragging = false;
        if (isCreatingWire) {
            if (wireStart && wireCurrent && (wireStart.x !== wireCurrent.x || wireStart.y !== wireCurrent.y)) {
                saveHistory();
                const newWires = calculateWirePath(wireStart, wireCurrent);
                wires.push(...newWires);
                autoClean(); 
            }
        }
        isCreatingWire = false; wireStart = null; wireCurrent = null;
    }

    function deleteSelected() {
        if (selectedObj) {
            saveHistory();
            elements = elements.filter(el => el !== selectedObj);
            selectedObj = null; updateSelectionUI(); autoClean();
        }
    }

    function toggleBatteryPolarity() {
        if (selectedObj && selectedObj.type === 'battery') {
            saveHistory();
            selectedObj.reverse = !selectedObj.reverse;
        }
    }

    function updateSelectionUI() {
        const panel = document.getElementById('selection-group');
        const propEditor = document.getElementById('prop-editor');
        if (panel && propEditor) {
            if (selectedObj && !isSimMode) {
                panel.style.display = 'block';
                propEditor.innerHTML = '';
                
                if (selectedObj.type === 'capacitor') {
                    const currentQ = selectedObj.q !== undefined ? selectedObj.q : ((selectedObj.polarity||1)*(selectedObj.charge||0));
                    const currentVoltage = selectedObj.val > 0 ? (currentQ / selectedObj.val).toFixed(1) : 0;
                    
                    propEditor.innerHTML = `
                        <label style="font-size: 13px; font-weight: 600; display:block; margin-bottom: 8px;">電気容量 (μF):
                            <input type="number" min="10" max="10000" step="10" value="${selectedObj.val}" 
                                   onchange="updateSelectedValue(this.value, 'val')"
                                   style="width: 100%; padding: 6px; margin-top: 4px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box;">
                        </label>
                        <label style="font-size: 13px; font-weight: 600; display:block;">初期電圧 (V)※電池なし実験用:
                            <input type="number" min="-100" max="100" step="1" value="${currentVoltage}" 
                                   onchange="updateSelectedValue(this.value, 'voltage')"
                                   style="width: 100%; padding: 6px; margin-top: 4px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box;">
                        </label>
                    `;
                } else if (selectedObj.type === 'battery') {
                    propEditor.innerHTML = `
                        <label style="font-size: 13px; font-weight: 600;">起電力 (V):
                            <input type="number" min="1" max="1000" step="1" value="${selectedObj.val}" 
                                   onchange="updateSelectedValue(this.value, 'val')"
                                   style="width: 100%; padding: 6px; margin-top: 5px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box;">
                        </label>
                        <button class="btn btn-tool" style="margin-top: 10px; width: 100%; min-height: 32px; font-size: 13px;" onclick="toggleBatteryPolarity()">
                            <span class="icon">🔄</span> 電源の向きを反転
                        </button>
                    `;
                }
            } else {
                panel.style.display = 'none';
            }
        }
    }

    function updateSelectedValue(val, type) {
        if (!selectedObj) return;
        if (selectedObj.type === 'capacitor') {
            if (type === 'val') {
                selectedObj.val = Math.max(10, parseFloat(val) || 10);
            } else if (type === 'voltage') {
                const v = parseFloat(val) || 0;
                selectedObj.q = selectedObj.val * v;
                selectedObj.charge = Math.abs(selectedObj.q);
                selectedObj.polarity = selectedObj.q >= 0 ? 1 : -1;
            }
        } else if (selectedObj.type === 'battery') {
            selectedObj.val = parseFloat(val) || 0;
        }
    }
    
    function loadDefault() {
        elements = [
            {type:'battery',rx:-120,ry:0,val:10,dir:'v',id:Date.now(), reverse: false},
            {type:'capacitor',rx:120,ry:0,val:500,charge:0,q:0,dir:'v',id:Date.now()+1},
            {type:'switch',rx:0,ry:-80,isOpen:true,dir:'h',id:Date.now()+2}
        ];
        wires = [
            {x1:-120,y1:-80,x2:120,y2:-80}, {x1:-120,y1:80,x2:120,y2:80},
            {x1:-120,y1:-80,x2:-120,y2:80}, {x1:120,y1:-80,x2:120,y2:80}
        ];
    }
    
    function getGridPos(p) { return { x: Math.round(p.rx / SNAP) * SNAP, y: Math.round(p.ry / SNAP) * SNAP }; }
    function getPos(e) { 
        const r = canvas.getBoundingClientRect(); 
        let cx = e.clientX, cy = e.clientY;
        if(e.touches && e.touches.length > 0) {
            cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        }
        return { rx: (cx - r.left - offsetX) / scale, ry: (cy - r.top - offsetY) / scale }; 
    }
    
    function resize() { 
        const oldW = canvas.width || 0;
        const oldH = canvas.height || 0;
        const parent = canvas.parentElement;
        canvas.width = parent.clientWidth; 
        canvas.height = parent.clientHeight; 
        
        if (offsetX === 0 && offsetY === 0) {
            offsetX = Math.floor(canvas.width/2 / SNAP) * SNAP; 
            offsetY = Math.floor(canvas.height/2 / SNAP) * SNAP; 
        } else if (oldW > 0 && oldH > 0) {
            offsetX += (canvas.width - oldW) / 2;
            offsetY += (canvas.height - oldH) / 2;
        }
        updateBackgroundPosition();
    }
    
    function setMode(m) { 
        mode = m; 
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active')); 
        document.getElementById('btn-'+m).classList.add('active'); 
        selectedObj = null; updateSelectionUI();
        canvas.style.cursor = (mode === 'pan') ? 'grab' : 'crosshair';
    }
    
    function toggleMode() { 
        isSimMode = !isSimMode; 
        
        if (!isSimMode) {
            dischargeAll();
        }

        elements.forEach(el => {
            if (el.type === 'switch') el.isOpen = true;
            if (el.type === 'capacitor') {
                if (isSimMode) {
                    if (el.q === undefined) el.q = (el.polarity || 1) * (el.charge || 0);
                    if (Math.abs(el.q) > 0.1) {
                        el.basePolarity = el.q >= 0 ? 1 : -1;
                    } else {
                        el.basePolarity = 1;
                    }
                }
            }
        });

        selectedObj = null; updateSelectionUI();
        
        document.getElementById('edit-panel').style.display = isSimMode ? "none" : "block"; 
        document.getElementById('sim-panel').style.display = isSimMode ? "block" : "none"; 
        
        const btn = document.getElementById('mode-toggle');
        if (isSimMode) {
            btn.innerHTML = '<span class="icon">■</span> 編集モードに戻る';
            btn.className = "btn btn-mode btn-edit";
            canvas.style.cursor = "grab";
        } else {
            btn.innerHTML = '<span class="icon">▶</span> 実験を開始する';
            btn.className = "btn btn-mode btn-sim";
            canvas.style.cursor = (mode === 'pan') ? 'grab' : 'crosshair';
        }
    }

    function zoomBtn(factor) {
        const rect = canvas.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        offsetX = cx - (cx - offsetX) * factor;
        offsetY = cy - (cy - offsetY) * factor;
        scale *= factor;
        updateBackgroundPosition();
    }

    function resetZoom() {
        scale = 1.0;
        offsetX = Math.floor(canvas.width/2 / SNAP) * SNAP; 
        offsetY = Math.floor(canvas.height/2 / SNAP) * SNAP; 
        updateBackgroundPosition();
    }
    
    function dischargeAll() { 
        elements.forEach(el => { 
            if(el.type === 'capacitor') { 
                el.charge = 0; el.q = 0; delete el.polarity; el.basePolarity = 1;
            }
        }); 
    }
    function resetToDefault() { 
        saveHistory(); 
        loadDefault(); 
        resetZoom();
        selectedObj = null; 
        updateSelectionUI(); 
    }
    function saveHistory() { history.push(JSON.stringify({e: elements, w: wires})); }
    function undo() { if(history.length > 0) { const s = JSON.parse(history.pop()); elements = s.e; wires = s.w; selectedObj=null; updateSelectionUI(); } }
    function distToSeg(p,v,w) { const l2=(v.x-w.x)**2+(v.y-w.y)**2; if(l2===0) return Math.hypot(p.rx-v.x,p.ry-v.y); let t=Math.max(0,Math.min(1,((p.rx-v.x)*(w.x-v.x)+(p.ry-v.y)*(w.y-v.y))/l2)); return Math.hypot(p.rx-(v.x+t*(w.x-v.x)),p.ry-(v.y+t*(w.y-v.y))); }

    init();
</script>
</body>
</html>
